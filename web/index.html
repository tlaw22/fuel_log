<!DOCTYPE html>
<html>
<head>
  <!-- Flutter replaces this value when building with --base-href. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A simple fuel log with weekly and monthly totals.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FuelLog">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>FuelLog</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
    }
    #startup-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #fff;
      z-index: 2147483647;
    }
    #startup-spinner {
      width: 36px;
      height: 36px;
      box-sizing: border-box;
      border: 4px solid rgba(0, 53, 102, 0.2);
      border-top-color: #003566;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #startup-error {
      color: #222;
      font: 16px sans-serif;
      text-align: center;
      padding: 24px;
    }
    #install-prompt {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 2147483646;
      max-width: 440px;
      max-height: calc(100vh - 24px);
      max-height: calc(100dvh - 24px);
      box-sizing: border-box;
      overflow-y: auto;
      margin: auto;
      padding: 16px;
      border: 1px solid #003566;
      border-radius: 12px;
      background: #fff;
      color: #1b2633;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      font: 15px/1.4 sans-serif;
    }
    #install-prompt[hidden] { display: none; }
    #install-prompt h2 { margin: 0 0 8px; font-size: 18px; }
    #install-prompt p { margin: 0 0 12px; }
    #install-prompt button {
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid #003566;
      border-radius: 8px;
      background: #fff;
      color: #003566;
      font: inherit;
      cursor: pointer;
    }
    #install-prompt #install-action { background: #003566; color: #fff; }
    #install-prompt button + button { margin-left: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #startup-spinner { animation: none; }
    }
  </style>
  <script>
    function showStartupError() {
      const loading = document.getElementById('startup-loading');
      if (!loading) return;
      document.getElementById('startup-spinner').hidden = true;
      document.getElementById('startup-error').hidden = false;
      loading.removeAttribute('aria-busy');
    }
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('startup-loading')?.remove();
    }, { once: true });
    window.addEventListener('unhandledrejection', showStartupError);
  </script>
  <script src="fuel_notifications.js" defer></script>
  <script src="install_prompt.js" defer></script>
  <script src="flutter_bootstrap.js" defer onerror="showStartupError()"></script>
</head>
<body>
  <div id="startup-loading" role="status" aria-label="Loading FuelLog" aria-busy="true">
    <div id="startup-spinner"></div>
    <div id="startup-error" role="alert" hidden>
      <p>Could not start FuelLog.</p>
      <button onclick="window.location.reload()">Retry</button>
    </div>
  </div>
  <section id="install-prompt" aria-labelledby="install-title" aria-live="polite" hidden>
    <h2 id="install-title">Install FuelLog on your phone</h2>
    <p>Keep FuelLog handy on your home screen. Existing saved data may not carry over to the installed app.</p>
    <p id="install-instructions" role="status" hidden></p>
    <button id="install-action" type="button">How to install</button>
    <button id="install-dismiss" type="button">Not now</button>
  </section>
</body>
</html>
